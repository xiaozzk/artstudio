<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D 预览图浏览器</title>
<link rel="stylesheet" href="vendor/spine-player/spine-player.css">
<script defer src="vendor/spine-player/spine-player.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --surface: #161a22;
    --surface-2: #1f2530;
    --text: #e8ecf1;
    --text-dim: #93a0b3;
    --border: #2a3140;
    --accent: #6ea8fe;
    --accent-ink: #0b1220;
    --danger: #ff8f7a;
    --tile: #1b2029;
    --shadow: 0 4px 24px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,17,21,.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px 10px;
  }
  h1 { margin: 0 0 3px; font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  h1 .path { color: var(--text-dim); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .stats { font-size: 12.5px; color: var(--text-dim); margin-bottom: 10px; }
  .stats b { color: var(--text); }
  .stats .warn { color: #ffd479; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .filter-label { font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }
  .select {
    padding: 5px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 12.5px; outline: none; max-width: 300px;
  }
  .select:focus { border-color: var(--accent); }
  .select.lib { font-weight: 600; }
  .btn {
    padding: 5px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 12.5px; cursor: pointer; white-space: nowrap;
    transition: border-color .15s, color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
  .btn.danger { color: var(--danger); border-color: #4a2b2b; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.icon { padding: 5px 9px; }
  .search {
    flex: 1; min-width: 200px; padding: 5px 12px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 12.5px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--text-dim); }

  /* ---------- 画廊：平铺卡片，不分组 ---------- */
  main { padding: 20px 24px 40px; max-width: 1760px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 13px; }
  .character-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    transition: border-color .15s, transform .15s;
  }
  .character-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .thumb {
    aspect-ratio: 1; background: var(--tile);
    position: relative; overflow: hidden; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb canvas { display: block; width: 100%; height: 100%; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb .state {
    font-size: 11px; color: var(--text-dim); text-align: center; padding: 0 10px; line-height: 1.6;
  }
  .thumb .state.failed { color: var(--danger); }
  .thumb .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thumb .play-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); font-size: 12px; opacity: 0; transition: opacity .15s;
  }
  .character-card:hover .play-hint { opacity: 1; }
  .character-info { padding: 8px 10px 9px; }
  .character-name {
    font-size: 12px; font-weight: 500; margin: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  .spine-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
  .spine-badge {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; white-space: nowrap;
  }
  .spine-badge.hot { color: #ffd479; border-color: #6b5a2a; }
  .spine-open-btn {
    margin-left: auto; padding: 2px 9px; border-radius: 5px;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font-size: 11px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .spine-open-btn:hover { background: var(--accent); color: var(--accent-ink); }
  .empty { text-align: center; color: var(--text-dim); padding: 70px 0; font-size: 14px; }

  /* ---------- 弹层 ---------- */
  .modal { position: fixed; inset: 0; background: rgba(6,8,12,.72); z-index: 150; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal[hidden] { display: none; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 22px 18px; width: 560px; max-width: 100%;
    max-height: 86vh; overflow: auto; box-shadow: var(--shadow);
  }
  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .modal-hint { font-size: 12px; color: var(--text-dim); margin: 0 0 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .row > label { font-size: 12.5px; color: var(--text-dim); white-space: nowrap; }
  .row .select { flex: 1; max-width: none; }
  .text-input {
    flex: 1; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font-size: 12.5px; outline: none; min-width: 0;
  }
  .text-input:focus { border-color: var(--accent); }
  .row.btns { margin-bottom: 8px; }
  .row.right { justify-content: flex-end; }
  .lib-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .lib-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2);
  }
  .lib-item.active { border-color: var(--accent); }
  .lib-item .meta { flex: 1; min-width: 0; }
  .lib-item .nm { font-size: 13px; font-weight: 600; }
  .lib-item .pth {
    font-size: 11px; color: var(--text-dim);
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kind-tag {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--border); color: var(--text-dim); white-space: nowrap;
  }
  .kind-tag.default { color: #9be7a8; border-color: #2f5b39; }
  .kind-tag.import { color: #ffd479; border-color: #6b5a2a; }
  .kind-tag.task { color: #c3a6ff; border-color: #4a3a6b; }
  .progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 10px 0 6px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
  .status { font-size: 12px; color: var(--text-dim); min-height: 18px; word-break: break-all; }
  .status.err { color: var(--danger); }
  .status.ok { color: #9be7a8; }

  /* ---------- Spine 全屏预览层 ---------- */
  #spine-lightbox { position: fixed; inset: 0; background: rgba(10,12,16,.97); z-index: 200; display: flex; flex-direction: column; }
  #spine-lightbox[hidden] { display: none; }
  .sp-lb-topbar {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .sp-lb-title { font-size: 15px; font-weight: 600; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
  .sp-lb-meta { font-size: 12px; color: var(--text-dim); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
  .sp-lb-meta b { color: #ffd479; }
  .sp-lb-close {
    margin-left: auto; width: 36px; height: 36px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    font-size: 18px; cursor: pointer;
  }
  .sp-lb-close:hover { border-color: var(--accent); color: var(--accent); }
  #spine-player-box { flex: 1; min-height: 0; }
  #spine-player-box .spine-player { height: 100%; }
</style>
</head>
<body>
  <header class="topbar">
    <h1>2D 预览图浏览器 <span class="path mono" id="lib-path"></span></h1>
    <div class="stats" id="stats">加载中…</div>
    <div class="filters">
      <span class="filter-label">预览库</span>
      <select id="lib-select" class="select lib" title="切换预览库"></select>
      <button class="btn" id="btn-new" title="新建（或登记）一个预览目录">＋ 新建目录</button>
      <button class="btn" id="btn-import" title="导入资源到独立目录">📥 导入资源</button>
      <button class="btn icon" id="btn-manage" title="管理预览库">⚙</button>
      <input type="search" class="search" id="search" placeholder="搜索：完整路径 / 骨架文件名（不区分大小写）…" autocomplete="off" spellcheck="false">
      <button class="btn icon" id="reload" title="重新扫描磁盘并刷新">↻</button>
    </div>
  </header>

  <main id="gallery"></main>

  <!-- 新建预览目录 -->
  <div class="modal" id="modal-new" hidden>
    <div class="modal-box">
      <div class="modal-title">新建预览目录</div>
      <p class="modal-hint">填一个磁盘目录：不存在会自动创建并登记为预览库；已存在则直接登记。默认目录是 <span class="mono">assets/2d</span>。</p>
      <div class="row"><label for="new-path">目录路径</label><input class="text-input mono" id="new-path" placeholder="D:/artstudio/assets/2d"></div>
      <div class="row"><label for="new-name">显示名称</label><input class="text-input" id="new-name" placeholder="留空则用目录名"></div>
      <div class="row right">
        <button class="btn" id="new-cancel">取消</button>
        <button class="btn primary" id="new-ok">创建并切换</button>
      </div>
    </div>
  </div>

  <!-- 导入资源 -->
  <div class="modal" id="modal-import" hidden>
    <div class="modal-box">
      <div class="modal-title">导入资源</div>
      <p class="modal-hint">选中的文件会被<b>复制</b>到目标库目录（保留你选中的子目录结构）。要出现在列表里，包内得有骨架 <span class="mono">xxx.json</span> + <span class="mono">xxx.atlas</span>。默认库 <span class="mono">assets/2d</span> 只读，导入必须落在独立目录。</p>
      <div class="row"><label for="import-target">目标库</label><select class="select" id="import-target"></select></div>
      <div class="row btns">
        <button class="btn" id="pick-dir">选择文件夹…</button>
        <button class="btn" id="pick-files">选择文件…</button>
        <input type="file" id="input-dir" webkitdirectory multiple hidden>
        <input type="file" id="input-files" multiple hidden>
      </div>
      <div class="progress"><div id="import-bar"></div></div>
      <div class="status" id="import-status">未开始</div>
      <div class="row right" style="margin-top:14px"><button class="btn" id="import-close">关闭</button></div>
    </div>
  </div>

  <!-- 管理预览库 -->
  <div class="modal" id="modal-manage" hidden>
    <div class="modal-box">
      <div class="modal-title">管理预览库</div>
      <p class="modal-hint">移除只是从清单里摘掉，<b>不会删除磁盘上的任何文件</b>。内置库不可移除。</p>
      <div class="lib-list" id="lib-list"></div>
      <div class="row right"><button class="btn" id="manage-close">关闭</button></div>
    </div>
  </div>

  <div id="spine-lightbox" hidden>
    <div class="sp-lb-topbar">
      <span class="sp-lb-title" id="sp-title"></span>
      <span class="sp-lb-meta" id="sp-meta"></span>
      <button class="sp-lb-close" id="sp-close" aria-label="关闭">✕</button>
    </div>
    <div id="spine-player-box"></div>
  </div>

<script>
"use strict";
const $ = s => document.querySelector(s);

// HTML 在 /tools/preview-2d/ 下，清单与它同目录；库文件走 /@lib/<库id>/<库内路径>
const MANIFEST_URL = "preview-manifest.json";
const API = {
  rescan: "/api/rescan",
  addLib: "/api/library/add",
  removeLib: "/api/library/remove",
  importFile: "/api/import",
};
const KIND_LABEL = { default: "默认", import: "导入", task: "实验", custom: "自建" };
const TILE_BG = "#1b2029";     // 卡片底色，player 的 clearColor 要跟它一致

const state = {
  manifest: null,
  libId: null,
  search: "",
  groups: [],
  spGroup: null,
  spPlayer: null,
  importing: false,
};

const encPath = p => String(p).split("/").map(encodeURIComponent).join("/");
const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- 数据 ----------

function currentLib() {
  const libs = (state.manifest && state.manifest.libraries) || [];
  return libs.find(l => l.id === state.libId) || libs[0] || null;
}

function libCountLabel(lib) {
  if (!lib.exists) return `${lib.name} · 目录不存在`;
  return `${lib.group_count} 组 · ${lib.anim_count} 动画`;
}

function applyManifest(m) {
  state.manifest = m;
  const libs = m.libraries || [];
  if (!libs.some(l => l.id === state.libId)) {
    const withContent = libs.find(l => l.group_count > 0) || libs[0];
    state.libId = withContent ? withContent.id : null;
  }
  renderLibSelect();
  renderAll();
}

function switchLibrary(id) {
  if (state.libId === id) return;
  state.libId = id;
  renderLibSelect();
  renderAll();
}

async function postJSON(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.ok === false) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// ---------- 筛选（只有关键字） ----------

function applyFilter() {
  const lib = currentLib();
  if (!lib) { state.groups = []; return; }
  const q = state.search.trim().toLowerCase();
  state.groups = (lib.groups || []).filter(g => {
    if (!q) return true;
    return (g.dir + " " + g.rel + " " + (g.spine ? g.spine.json : "")).toLowerCase().includes(q);
  });
}

// ---------- 渲染 ----------

function renderLibSelect() {
  const sel = $("#lib-select");
  sel.innerHTML = "";
  for (const lib of (state.manifest && state.manifest.libraries) || []) {
    const opt = new Option(`${lib.name} — ${libCountLabel(lib)}`, lib.id);
    if (!lib.exists) opt.style.color = "var(--danger)";
    sel.appendChild(opt);
  }
  if (state.libId) sel.value = state.libId;
}

function renderStats() {
  const lib = currentLib();
  if (!lib) { $("#stats").textContent = "没有可用预览库。"; return; }
  $("#lib-path").textContent = lib.display_path;
  $("#lib-path").title = lib.display_path;
  const shown = state.groups.length;
  const total = lib.group_count;
  const filtered = state.search.trim()
    ? `（筛选出 ${shown} / ${total}）` : "";
  $("#stats").innerHTML =
    `共 <b>${total}</b> 组 Spine 资源（共 <b>${lib.anim_count}</b> 个动画）${filtered} · ` +
    `卡片为 <b>实时静态渲染</b>（每个插槽按当时的位置定格一帧，网格里不动）<span style="opacity:.7"> · 点卡片看动画</span>` +
    (lib.exists ? "" : ` <span class="warn">· 目录不存在</span>`);
}

function renderAll() {
  applyFilter();
  renderStats();
  renderGallery();
}

function makeBadges(g) {
  const badges = document.createElement("div");
  badges.className = "spine-badges";
  const sp = g.spine;
  const mk = (txt, hot) => {
    const b = document.createElement("span");
    b.className = "spine-badge" + (hot ? " hot" : "");
    b.textContent = txt;
    badges.appendChild(b);
  };
  mk(`🎬 ${sp.n_animations}`, sp.n_animations > 0);
  mk(`🦴 ${sp.n_bones}`, false);
  if (sp.n_skins > 1) mk(`🎨 ${sp.n_skins}`, true);
  const btn = document.createElement("button");
  btn.className = "spine-open-btn";
  btn.textContent = "骨骼预览";
  btn.addEventListener("click", ev => { ev.stopPropagation(); openSpine(g); });
  badges.appendChild(btn);
  return badges;
}

function makeCard(g) {
  const card = document.createElement("article");
  card.className = "character-card";

  // 缩略图：setup pose 由 spine-player 实时渲（不是文件夹里离线渲好的 PNG）
  const box = document.createElement("div");
  box.className = "thumb";
  box.title = g.dir;
  const spinner = document.createElement("div");
  spinner.className = "spinner";
  box.appendChild(spinner);
  // 悬停提示盖在缩略图上；paintThumb 会清空 box，所以渲染完要补回来
  const hint = document.createElement("div");
  hint.className = "play-hint";
  hint.textContent = "▶ 播放动画";
  box.__hint = hint;
  box.addEventListener("click", () => openSpine(g));
  card.appendChild(box);
  watchThumb(box, g);

  const info = document.createElement("div");
  info.className = "character-info";
  const nm = document.createElement("div");
  nm.className = "character-name";
  nm.textContent = g.dir;          // 名称 = 完整路径（库内相对路径）
  nm.title = g.dir;
  info.appendChild(nm);
  info.appendChild(makeBadges(g));
  card.appendChild(info);
  return card;
}

function renderGallery() {
  const main = $("#gallery");
  main.innerHTML = "";
  const lib = currentLib();
  if (state.groups.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    if (!lib) empty.textContent = "没有可用预览库。";
    else if (!lib.exists) empty.textContent = `库「${lib.name}」的目录还不存在：${lib.display_path}`;
    else if (state.search.trim()) empty.textContent = "没有匹配的资源。换个关键字试试。";
    else empty.textContent =
      "这个库里没有 Spine 资源。只有含「骨架 json + atlas」的目录才会出现在这里——" +
      "用「📥 导入资源」或「＋ 新建目录」加一个。";
    main.appendChild(empty);
    return;
  }
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const g of state.groups) grid.appendChild(makeCard(g));
  main.appendChild(grid);
}

// ---------- 缩略图：实时渲（一次并行 10 个）----------

// 渲好的位图按路径缓存：搜索时网格会整体重建，没有缓存的话每敲一个字
// 就得把 105 个骨架重新载一遍再渲一遍。
const THUMB_CONCURRENCY = 3;    // 并行数。官方 player 每个都自带一个 WebGL 上下文 + 独立 rAF 渲染循环，
                                // 本机实测的边界：10 → 渲染进程崩溃（标签页 about:blank）；
                                // 5 → 页面卡死（连读一个文本都 275s 超时）；3 → 稳定。
                                // 想再往上调，先在自己机器上按同样方式试（数字不一定通用）。
const thumbCache = new Map();
const thumbQueue = [];
let thumbRunning = 0;

const thumbObserver = typeof IntersectionObserver === "function"
  ? new IntersectionObserver(entries => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        thumbObserver.unobserve(e.target);
        thumbQueue.push({ box: e.target, g: e.target.__g });
      }
      pumpThumbs();
    }, { rootMargin: "500px 0px" })
  : null;

function watchThumb(box, g) {
  box.__g = g;
  if (thumbObserver) thumbObserver.observe(box);
  else { thumbQueue.push({ box, g }); pumpThumbs(); }
}

/**
 * 并发池：一次最多 THUMB_CONCURRENCY 个 player 在跑，谁先完成谁先让位。
 * 每个 player 渲完一帧就 dispose，10 个同时活着只是瞬时占用；再往上加之前
 * 要先看浏览器的 WebGL 上下文上限（老设备 8~16 个，超了老上下文被回收就变黑块）。
 */
function pumpThumbs() {
  while (thumbRunning < THUMB_CONCURRENCY && thumbQueue.length) {
    const job = thumbQueue.shift();
    if (!job.box.isConnected) continue;      // 搜索重排后旧卡片已被丢弃
    thumbRunning++;
    renderThumb(job.box, job.g)
      .catch(() => { /* renderThumb 内部已兜底，这里只防意外 */ })
      .then(() => {
        thumbRunning--;
        if (thumbQueue.length) pumpThumbs();
      });
  }
}

function paintThumb(box, url) {
  box.innerHTML = "";
  const img = document.createElement("img");
  img.src = url;
  img.alt = box.__g ? box.__g.dir : "";
  img.decoding = "async";
  box.appendChild(img);
  if (box.__hint) box.appendChild(box.__hint);
}

/**
 * 缩略图：**静态**渲染 —— 每个插槽的附件按它当时的世界位置画一帧，渲完存成位图；
 * 网格里不会动，也不留 player 跑动画。数据全部来自骨架 json + atlas，
 * 不读文件夹里离线渲好的 PNG。
 *
 * 这个 runtime（spine-player 4.3.x）有几处不直观的地方，全踩过，结论都写在下面：
 * 1. **纯 setup pose 渲不出东西**。实测附件确实挂上了（哪吒童 10 个 / 紫翼魔姬 109 个）、
 *    骨骼与包围盒也都对，墨迹仍是 0% —— 交付件的槽位 json 大多没写 `attachment` 字段，
 *    美术在皮肤 + 动画的 attach / transform timeline 里。**必须让 player 先应用一次动画**
 *    才有像素，所以这里传了第一个动画，但只用于初始化 + 取定格帧，随即 `pause()`；
 *    最终那张图是静态的（网格里不会动）。
 * 2. **定格写法**照抄 player 自己时间轴的 seek：`animationState.update(目标 - playTime)`
 *    + `animationState.apply(skeleton)`，再 `pause()`。定格在第一个动画的 10% 处。
 * 3. **`slot.attachment` 不可信**：永远是 null，渲染读的是 `slot.appliedPose.attachment`；
 *    `slot.setAttachment` 也不是方法（要手动挂件只能直接写 pose 对象）。
 * 4. **皮肤**用第一个（与 runtime 自己的默认行为一致），见 config 里的 `skin`。
 * 5. **不能开 mipmaps:false**。vendor 的 loadSkeleton 里 `page.texture.update(true)`
 *    只在 minFilter 既不是 Nearest 也不是 Linear 时调用；关掉 mipmaps 后 minFilter 就是
 *    Linear → 纹理永远不上传 → 截出来只有背景色。
 * 6. **不能只靠 requestAnimationFrame**：后台标签里 rAF 不触发，缩略图会永远停在空白。
 *    最后主动 `drawFrame(false)` 同步渲一帧再截。
 * 7. **不要覆盖 currentViewport**。手动算紧边界 / 覆盖视口看着更稳，实测反而整张渲空
 *    （哪吒童 / 紫翼魔姬 / 红面钟馗 墨迹全 0）。沿用 player 自己按动画算的视口最稳；
 *    代价是 bounds=Infinity 的包（实测火把哥布林 / 矛枪哥布林 / 骑猪勇者）取不到景，
 *    落到「无法自动取景」分支，点开仍能播动画。
 *
 * 为什么渲一帧就 dispose：并发渲染时同时活着的 WebGL 上下文是稀缺资源（见 THUMB_CONCURRENCY）。
 * 渲一帧 → toBlob → 释放上下文是最省的做法。
 */
const THUMB_SETTLE = 350;     // 让 player 跑一会儿：纹理是在它第一次 drawFrame 时才上传的
const THUMB_INK_MIN = 0.4;    // 画布非背景像素占比低于这个值 = 渲空了

function renderThumb(box, g) {
  const key = `${state.libId}|${g.dir}|${g.spine.json}`;   // 跨库同名目录也不能串
  const cached = thumbCache.get(key);
  if (cached) { paintThumb(box, cached); return Promise.resolve(); }
  if (typeof spine === "undefined" || !spine.SpinePlayer) {
    box.innerHTML = "";
    const p = document.createElement("div");
    p.className = "state failed";
    p.textContent = "spine-player 未加载";
    box.appendChild(p);
    return Promise.resolve();
  }
  return new Promise(resolve => {
    const sp = g.spine;
    let player = null, settled = false;
    const finish = (payload, errMsg) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      try { if (player) player.dispose(); } catch (_) {}
      player = null;
      if (payload) {
        thumbCache.set(key, payload);
        paintThumb(box, payload);
      } else {
        box.innerHTML = "";
        const p = document.createElement("div");
        p.className = "state failed";
        p.textContent = errMsg || "渲染失败";
        p.title = "点卡片仍可打开骨骼预览";
        box.appendChild(p);
      }
      resolve();
    };
    const timer = setTimeout(() => finish(null, "渲染超时"), 30000);
    try {
      // 动画只是"初始化手段"，不是要展示的内容（见上方注释第 7 条）
      player = new spine.SpinePlayer(box, {
        skeleton: g.base + encPath(sp.json),
        atlas: g.base + encPath(sp.atlas),
        ...(sp.animations.length ? { animation: sp.animations[0] } : {}),
        // 有多套皮肤时默认加载**第一个**皮肤（与 runtime 自己的默认行为一致）
        ...(sp.skins && sp.skins.length ? { skin: sp.skins[0] } : {}),
        showControls: false,
        showLoading: false,
        preserveDrawingBuffer: true,  // 截这一帧需要
        backgroundColor: TILE_BG,
        error: (p, msg) => finish(null, msg || "加载失败"),
        success: (p) => {
          setTimeout(() => {
            const sk = p.skeleton;
            // 1) 定格：暂停 + 定位到第一个动画的 10%（写法照抄 player 时间轴的 seek）。
            //    定位之后网格里就是一张静态图，不会动。
            try { p.pause(); } catch (e) { /* 继续 */ }
            try {
              const entry = p.animationState.getTrack(0);
              const dur = entry && entry.animation ? entry.animation.duration : 0;
              if (dur > 0) {
                p.animationState.update(dur * 0.1 - p.playTime);
                p.animationState.apply(sk);
              }
            } catch (e) { /* 继续 */ }
            // 2) 皮肤交给 config 的 `skin: skins[0]`（第一个皮肤），这里不再改。
            //    曾经在这里换成「附件最多的」那套来救 default 空壳的包，实测没用（3 个包照样空白），
            //    反而偏离"默认加载第一个皮肤"的口径 —— 去掉。
            try { sk.updateWorldTransform(2); } catch (e) { /* 继续 */ }
            // 3) 取景**不动** —— 沿用 player 自己按动画算好的视口。
            //    实测手动覆盖 currentViewport 反而整张渲空（哪吒童 / 紫翼魔姬 / 红面钟馗 全变 0 墨迹），
            //    代价是火把哥布林这类 bounds=Infinity 的包取不到景，落到"无法自动取景"分支。
            try { p.drawFrame(false); } catch (e) { /* 截不到就按"渲空"处理 */ }
            const cv = box.querySelector("canvas");
            if (!cv) return finish(null, "没有 canvas");
            if (inkRatio(cv) < THUMB_INK_MIN) {
              return finish(null, "无法自动取景 · 点开可看");
            }
            if (cv.toBlob) {
              cv.toBlob(b => finish(b ? URL.createObjectURL(b) : null,
                                    b ? null : "截帧失败"), "image/png");
            } else {
              finish(cv.toDataURL("image/png"), null);
            }
          }, THUMB_SETTLE);
        },
      });
    } catch (e) {
      finish(null, e.message || String(e));
    }
  });
}

/** 画布非背景像素占比（%）。后台标签不重绘，截图不可信，只能这么判"渲没渲出来"。 */
function inkRatio(cv) {
  try {
    const t = document.createElement("canvas");
    t.width = 32; t.height = 32;
    const c = t.getContext("2d");
    c.drawImage(cv, 0, 0, 32, 32);
    const d = c.getImageData(0, 0, 32, 32).data;
    const bg = [d[0], d[1], d[2]];
    let n = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]) > 24) n++;
    }
    return (n / 1024) * 100;
  } catch (e) { return 0; }
}


// ---------- Spine 全屏预览 ----------

function openSpine(g) {
  const sp = g.spine;
  if (!sp) return;
  if (typeof spine === "undefined" || !spine.SpinePlayer) {
    alert("spine-player 未加载（vendor/spine-player/spine-player.js 缺失？）");
    return;
  }
  closeSpine();
  state.spGroup = g;
  $("#sp-title").textContent = g.dir;
  $("#sp-meta").innerHTML =
    `Spine <b>${escapeHtml(sp.version)}</b> · <b>${sp.n_animations}</b> 动画 · ` +
    `<b>${sp.n_bones}</b> 骨骼 · <b>${sp.n_skins}</b> 皮肤` +
    (sp.animations.length ? ` · ${escapeHtml(sp.animations.join(" / "))}` : "");
  $("#spine-lightbox").hidden = false;
  document.body.style.overflow = "hidden";
  const box = $("#spine-player-box");
  box.innerHTML = "";
  try {
    // 注意 4.3 player 的字段名：skeleton（不是 4.2 的 jsonUrl）、atlas（别名 atlasUrl）。
    // 写错会在 validateConfig 抛 "A URL must be specified..."。
    state.spPlayer = new spine.SpinePlayer(box, {
      skeleton: g.base + encPath(sp.json),
      atlas: g.base + encPath(sp.atlas),
      showControls: true,
      backgroundColor: "#161a22",
      ...(sp.animations.length ? { animation: sp.animations[0] } : {}),
      ...(sp.skins && sp.skins.length ? { skin: sp.skins[0] } : {}),
      success: (player) => { try { player.play?.(); } catch (_) {} },
      error: (player, msg) => { box.innerHTML = `<div class="empty">加载失败：${escapeHtml(msg)}</div>`; },
    });
  } catch (e) {
    box.innerHTML = `<div class="empty">播放器初始化失败：${escapeHtml(e.message)}</div>`;
  }
}

function closeSpine() {
  if (state.spPlayer) {
    try { state.spPlayer.dispose(); } catch (_) {}
    state.spPlayer = null;
  }
  $("#spine-player-box").innerHTML = "";
  $("#spine-lightbox").hidden = true;
  document.body.style.overflow = "";
  state.spGroup = null;
}

// ---------- 弹层：新建目录 / 导入 / 管理 ----------

function showModal(id) { $(id).hidden = false; }
function hideModal(id) { $(id).hidden = true; }

function openNewDialog() {
  $("#new-path").value = $("#new-path").value || "D:/artstudio/assets/2d";
  $("#new-name").value = "";
  showModal("#modal-new");
  $("#new-path").focus();
  $("#new-path").select();
}

async function submitNewLibrary() {
  const path = $("#new-path").value.trim();
  const name = $("#new-name").value.trim();
  if (!path) { alert("请填写目录路径"); return; }
  try {
    const data = await postJSON(API.addLib, { path, name });
    hideModal("#modal-new");
    applyManifest(data.manifest);
    if (data.id) switchLibrary(data.id);
  } catch (e) {
    alert("新建失败：" + e.message);
  }
}

function openImportDialog() {
  const sel = $("#import-target");
  sel.innerHTML = "";
  for (const lib of (state.manifest && state.manifest.libraries) || []) {
    if (lib.kind === "default" || lib.kind === "task") continue;  // 默认库只读、实验库是虚拟的
    sel.appendChild(new Option(`${lib.name} — ${lib.display_path}`, lib.id));
  }
  if (!sel.options.length) {
    setImportStatus("没有可写入的库，请先「＋ 新建目录」建一个。", "err");
  }
  setImportStatus("未开始", "");
  $("#import-bar").style.width = "0%";
  showModal("#modal-import");
}

function setImportStatus(text, cls) {
  const el = $("#import-status");
  el.textContent = text;
  el.className = "status" + (cls ? " " + cls : "");
}

async function doImport(files) {
  if (state.importing) return;
  const target = $("#import-target").value;
  if (!target) return;
  if (!files || !files.length) { setImportStatus("没有选中任何文件。", "err"); return; }
  state.importing = true;
  const bar = $("#import-bar");
  let done = 0, bytes = 0;
  setImportStatus(`准备导入 ${files.length} 个文件…`, "");
  for (const f of files) {
    const rel = f.webkitRelativePath || f.name;
    try {
      const r = await fetch(API.importFile, {
        method: "POST",
        headers: {
          "Content-Type": "application/octet-stream",
          "X-Lib-Target": target,
          "X-File-Path": encodeURIComponent(rel),
        },
        body: f,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.ok === false) throw new Error(data.error || `HTTP ${r.status}`);
      bytes += data.size || f.size || 0;
    } catch (e) {
      setImportStatus(`导入中断：${rel} —— ${e.message}`, "err");
      state.importing = false;
      return;
    }
    done++;
    bar.style.width = `${Math.round(done / files.length * 100)}%`;
    setImportStatus(`已导入 ${done}/${files.length} 个文件（${(bytes / 1048576).toFixed(1)} MiB）`, "");
  }
  setImportStatus(`完成：${done} 个文件已复制，正在重扫…`, "ok");
  try {
    const data = await postJSON(API.rescan, { lib: target });
    applyManifest(data.manifest);
    switchLibrary(target);
  } catch (e) {
    setImportStatus("导入完成，但重扫失败：" + e.message, "err");
  }
  state.importing = false;
  $("#input-dir").value = "";
  $("#input-files").value = "";
}

function openManageDialog() {
  const box = $("#lib-list");
  box.innerHTML = "";
  for (const lib of (state.manifest && state.manifest.libraries) || []) {
    const row = document.createElement("div");
    row.className = "lib-item" + (lib.id === state.libId ? " active" : "");
    const meta = document.createElement("div");
    meta.className = "meta";
    const nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = lib.name;
    const pth = document.createElement("div");
    pth.className = "pth";
    pth.textContent = `${lib.display_path} — ${libCountLabel(lib)}`;
    pth.title = pth.textContent;
    meta.appendChild(nm);
    meta.appendChild(pth);
    const tag = document.createElement("span");
    tag.className = "kind-tag " + lib.kind;
    tag.textContent = KIND_LABEL[lib.kind] || lib.kind;
    row.appendChild(meta);
    row.appendChild(tag);
    if (!lib.builtin) {
      const rm = document.createElement("button");
      rm.className = "btn danger";
      rm.textContent = "移除";
      rm.title = "只从清单移除，不删除磁盘文件";
      rm.addEventListener("click", async () => {
        if (!confirm(`从清单移除「${lib.name}」？\n磁盘上的文件不会被删除。`)) return;
        try {
          const data = await postJSON(API.removeLib, { id: lib.id });
          applyManifest(data.manifest);
          openManageDialog();
        } catch (e) {
          alert("移除失败：" + e.message);
        }
      });
      row.appendChild(rm);
    } else {
      const lock = document.createElement("span");
      lock.className = "kind-tag";
      lock.textContent = "内置";
      row.appendChild(lock);
    }
    box.appendChild(row);
  }
  showModal("#modal-manage");
}

// ---------- 加载与事件 ----------

async function load() {
  try {
    const r = await fetch(MANIFEST_URL + "?t=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    applyManifest(await r.json());
  } catch (e) {
    $("#stats").innerHTML =
      `<span style="color:#ff8f7a">清单加载失败：${escapeHtml(e.message)}</span>。` +
      `请运行 python tools/preview-2d/serve.py 扫描并启动服务。`;
  }
}

$("#lib-select").addEventListener("change", e => switchLibrary(e.target.value));
let searchTimer = null;
$("#search").addEventListener("input", e => {
  state.search = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderAll, 120);   // 防抖：网格重建 + 缩略图重挂
});
$("#btn-new").addEventListener("click", openNewDialog);
$("#btn-import").addEventListener("click", openImportDialog);
$("#btn-manage").addEventListener("click", openManageDialog);
$("#new-ok").addEventListener("click", submitNewLibrary);
$("#new-cancel").addEventListener("click", () => hideModal("#modal-new"));
$("#new-path").addEventListener("keydown", e => { if (e.key === "Enter") submitNewLibrary(); });
$("#import-close").addEventListener("click", () => hideModal("#modal-import"));
$("#manage-close").addEventListener("click", () => hideModal("#modal-manage"));
$("#pick-dir").addEventListener("click", () => $("#input-dir").click());
$("#pick-files").addEventListener("click", () => $("#input-files").click());
$("#input-dir").addEventListener("change", e => doImport(Array.from(e.target.files || [])));
$("#input-files").addEventListener("change", e => doImport(Array.from(e.target.files || [])));
$("#reload").addEventListener("click", async () => {
  const btn = $("#reload");
  btn.textContent = "…";
  try {
    const data = await postJSON(API.rescan, {});
    applyManifest(data.manifest);
  } catch (e) {
    alert("重扫失败：" + e.message);
  } finally {
    btn.textContent = "↻";
  }
});
$("#sp-close").addEventListener("click", closeSpine);
for (const id of ["#modal-new", "#modal-import", "#modal-manage"]) {
  $(id).addEventListener("click", e => { if (e.target === $(id)) hideModal(id); });
}
document.addEventListener("keydown", e => {
  const modal = $(".modal:not([hidden])");
  if (modal) {
    if (e.key === "Escape") modal.hidden = true;
    return;
  }
  if (!$("#spine-lightbox").hidden) {
    if (e.key === "Escape") closeSpine();
    return;
  }
  if (e.key === "/" && document.activeElement !== $("#search")) {
    $("#search").focus(); $("#search").select(); e.preventDefault();
  }
});

load();
</script>
